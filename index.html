<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fffbf5}
body{display:flex;flex-direction:column;position:relative}
.container{display:flex;flex:1;overflow:hidden;min-height:0}
.title{
    text-align:center;font-size:22px;color:#6b4f3f;padding:16px 0;font-weight:600;
    background:#fffbf5;flex-shrink:0;z-index:2;
}
/* 左侧菜系侧边栏 */
.category-wrap{
    width:100px;overflow-y:auto;scrollbar-width:none;padding:8px 6px;
    background:#fff;border-right:1px solid #f0e3d9;flex-shrink:0;
    -webkit-overflow-scrolling:touch;
}
.category-wrap::-webkit-scrollbar{display:none}
.category-item{
    padding:12px 6px;margin-bottom:8px;background:#ffffff;border-radius:12px;
    font-size:14px;color:#66554b;text-align:center;
    box-shadow:0 2px 6px rgba(180,150,120,0.1);transition:0.2s;
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    user-select:none;
}
.category-item.active{background:#f7a066;color:#fff;font-weight:500}
/* 右侧区域 */
.right-area{
    flex:1;overflow-y:auto;padding:0 12px 220px;min-width:0;
    -webkit-overflow-scrolling:touch;
}
.search-bar{
    position:sticky;top:0;z-index:5;background:#fffbf5;
    padding:10px 0 8px;display:flex;flex-direction:column;gap:8px;
}
.search-input{
    width:100%;border:none;border-radius:99px;padding:10px 16px;
    font-size:15px;background:#fff;color:#443830;
    box-shadow:0 2px 8px rgba(170,140,110,0.1);outline:none;
}
.search-input::placeholder{color:#b0a090}
.search-input:focus{box-shadow:0 2px 8px rgba(247,160,102,0.25)}
.filter-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:13px;color:#887060;padding:0 2px;
}
.filter-toggle{
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    padding:6px 12px;border-radius:99px;background:#fff;
    box-shadow:0 1px 4px rgba(170,140,110,0.12);transition:0.15s;
}
.filter-toggle:active{transform:scale(0.97)}
.filter-toggle input{accent-color:#f7a066;cursor:pointer}
.filter-count{color:#b0a090;font-size:12px}
.food-list{display:flex;flex-direction:column;gap:10px}
.food-row{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;
    padding:10px;box-shadow:0 2px 8px rgba(170,140,110,0.08);flex-wrap:nowrap;
}
.food-img-wrap{
    width:64px;height:64px;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    flex-shrink:0;background:#f5efe6;position:relative;
}
.food-img{width:100%;height:100%;display:block;object-fit:cover}
.food-img[data-error="1"]::after{
    content:"🍽";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:24px;color:#ccc;background:#f5efe6;
}
.food-name{
    width:76px;font-size:15px;color:#443830;flex-shrink:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ctrl-group{display:flex;align-items:center;gap:12px;margin-left:auto;flex-shrink:0;flex-wrap:wrap}
.ctrl-item{display:flex;align-items:center;gap:6px}
.ctrl-name{font-size:13px;color:#776559;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl button{
    width:30px;height:30px;border-radius:50%;border:none;background:#fff3e9;
    color:#d47b46;font-size:18px;transition:0.15s;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    touch-action:manipulation;
}
.ctrl button:active{background:#f7a066;color:#fff;transform:scale(0.92)}
.num{
    font-size:15px;width:26px;text-align:center;color:#55443c;
    font-variant-numeric:tabular-nums;
}
.list-empty{
    text-align:center;padding:40px 0;color:#b0a090;font-size:14px;
}
/* 预览栏 —— 加上图片 */
.preview-bar{
    position:fixed;left:100px;right:0;bottom:72px;background:#fff;
    padding:10px 14px;box-shadow:0 -2px 8px rgba(170,140,110,0.1);
    z-index:3;max-height:160px;overflow-y:auto;
}
.preview-inner{max-width:700px;margin:0 auto}
.preview-title{font-size:13px;color:#887060;margin-bottom:6px}
.preview-text{
    font-size:14px;color:#443830;min-height:20px;word-wrap:break-word;
    line-height:1.6;max-height:110px;overflow-y:auto;
}
/* 预览项带图片 */
.preview-item{
    display:inline-flex;align-items:center;gap:6px;
    background:#fef7f0;border-radius:20px;padding:4px 10px 4px 4px;
    margin:0 6px 6px 0;vertical-align:middle;
    box-shadow:0 1px 4px rgba(170,140,110,0.08);
    max-width:100%;
}
.preview-img{
    width:28px;height:28px;border-radius:50%;object-fit:cover;
    background:#f5efe6;flex-shrink:0;
}
.preview-name{
    font-size:13px;color:#443830;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100px;
}
.preview-num{
    font-size:12px;color:#d47b46;font-weight:500;white-space:nowrap;
}
/* 底部提交按钮 */
.bottom-bar{
    position:fixed;left:100px;right:0;bottom:0;background:#ffffff;
    padding:10px 14px;box-shadow:0 -3px 12px rgba(170,140,110,0.12);
    z-index:4;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.bottom-inner{max-width:700px;margin:0 auto;display:flex;justify-content:flex-end}
.submit{
    padding:12px 36px;border:none;border-radius:99px;background:#f7a066;
    color:#fff;font-size:17px;box-shadow:0 3px 10px rgba(247,160,102,0.3);
    cursor:pointer;transition:0.15s;touch-action:manipulation;
    font-weight:500;
}
.submit:active{transform:scale(0.96);background:#e89055}
.submit:disabled{opacity:0.6;cursor:not-allowed;transform:none}

/* 平板/桌面适配 */
@media (min-width:600px){
    .category-wrap{width:120px}
    .preview-bar{left:120px}
    .bottom-bar{left:120px}
    .food-img-wrap{width:72px;height:72px}
    .food-name{width:90px;font-size:15px}
    .ctrl-group{gap:18px}
}

/* 极窄屏适配 */
@media (max-width:360px){
    .category-wrap{width:84px}
    .preview-bar{left:84px}
    .bottom-bar{left:84px}
    .food-name{width:62px;font-size:14px}
    .ctrl-group{gap:6px}
    .ctrl-name{font-size:12px}
    .ctrl button{width:28px;height:28px;font-size:16px}
    .num{width:22px;font-size:14px}
    .preview-name{max-width:70px;font-size:12px}

/* 下单人输入栏 */
.user-bar{
    display:flex;align-items:center;gap:8px;padding:6px 16px 10px;
    font-size:14px;color:#776559;flex-shrink:0;
}
.user-bar input{
    flex:1;border:none;border-radius:99px;padding:8px 14px;font-size:14px;
    background:#fff;color:#443830;box-shadow:0 2px 6px rgba(170,140,110,0.1);

}
.user-bar input:focus{box-shadow:0 2px 8px rgba(247,160,102,0.25)}

/* 查看订单链接 */
.bottom-inner{align-items:center;gap:10px}
.view-order{
    padding:10px 20px;border-radius:99px;background:#fff3e9;color:#d47b46;
    text-decoration:none;font-size:15px;box-shadow:0 2px 8px rgba(170,140,110,0.12);
}
.view-order:active{transform:scale(0.96)}
</style>

// ========== 状态 ==========
let currentCate = "all";
let searchKeyword = "";
let onlySelected = false;
// cart: { 菜名: { p: 份数 } }   —— 只保留份数
let cart = {};

// ========== 本地存储 ==========
function loadCart() {
    try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
                // 兼容旧格式，把 n 忽略，只保留 p
                const cleaned = {};
                Object.keys(parsed).forEach(name => {
                    const item = parsed[name];
                    const p = item.p || 0;
                    if (p > 0) cleaned[name] = { p };
                });
                cart = cleaned;
            }
        }
    } catch (e) {
        cart = {};
    }
}
function saveCart() {
    try {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    } catch (e) {}
}

// ========== 工具 ==========
function getCateName(cate) {
    const map = {
        hotpot: "火锅菜品", snack: "饮品炸物", sichuan: "川菜", xiang: "湘菜",
        cantonese: "粤菜", huaiyang: "淮扬菜", shandong: "鲁菜", zhe: "浙菜",
        dongbei: "东北菜", min: "闽菜", hui: "徽菜", home: "家常小炒"
    };
    return map[cate] || cate;
}

function getPortion(name) {
    return cart[name] && cart[name].p ? cart[name].p : 0;
}
function setPortion(name, p) {
    if (p <= 0) {
        delete cart[name];
    } else {
        cart[name] = { p };
    }
    saveCart();
}

function selectedCount() {
    return Object.keys(cart).filter(name => getPortion(name) > 0).length;
}
function totalDishCount() {
    let total = 0;
    Object.keys(cart).forEach(name => {
        total += getPortion(name);
    });
    return total;
}

// ========== 渲染列表 ==========
const foodListEl = document.getElementById("foodList");
const filterCountEl = document.getElementById("filterCount");
const searchInput = document.getElementById("searchInput");
const onlySelectedEl = document.getElementById("onlySelected");
const categoryWrap = document.getElementById("categoryWrap");
const previewText = document.getElementById("previewText");
const submitBtn = document.getElementById("submitBtn");
const rightArea = document.getElementById("rightArea");

// ========== 下单人（存 localStorage） ==========
const USER_KEY = "xiaofanzhuo_user";
const userNameInput = document.getElementById("userNameInput");
function loadUser() {
    try {
        userNameInput.value = localStorage.getItem(USER_KEY) || "";
    } catch (e) {}
}
userNameInput.addEventListener("input", () => {
    try {
        localStorage.setItem(USER_KEY, userNameInput.value.trim());
    } catch (e) {}
});

function getFilteredList() {
    return foodList.filter(item => {
        if (currentCate !== "all" && item.cate !== currentCate) return false;
        if (searchKeyword && !item.name.includes(searchKeyword)) return false;
        if (onlySelected) {
            if (getPortion(item.name) <= 0) return false;
        }
        return true;
    });
}

function renderList() {
    const list = getFilteredList();
    foodListEl.innerHTML = "";

    if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "暂无匹配菜品";
        foodListEl.appendChild(empty);
    } else {
        list.forEach(item => {
            const row = document.createElement("div");
            row.className = "food-row";

            // 图片
            const imgWrap = document.createElement("div");
            imgWrap.className = "food-img-wrap";
            const img = document.createElement("img");
            img.className = "food-img";
            img.src = item.img;
            img.alt = item.name;
            img.loading = "lazy";
            img.onerror = function() {
                this.setAttribute("data-error", "1");
                this.style.visibility = "hidden";
            };
            imgWrap.appendChild(img);

            // 菜名
            const nameEl = document.createElement("div");
            nameEl.className = "food-name";
            nameEl.textContent = item.name;
            nameEl.title = item.name;

            // 控制组 —— 只有份数
            const ctrlGroup = document.createElement("div");
            ctrlGroup.className = "ctrl-group";

            const portionItem = document.createElement("div");
            portionItem.className = "ctrl-item";
            const portionName = document.createElement("span");
            portionName.className = "ctrl-name";
            portionName.textContent = "份数";
            const portionCtrl = document.createElement("div");
            portionCtrl.className = "ctrl";
            const pMinus = document.createElement("button");
            pMinus.type = "button";
            pMinus.textContent = "−";
            pMinus.setAttribute("aria-label", "减少份数");
            const pNum = document.createElement("span");
            pNum.className = "num";
            pNum.textContent = getPortion(item.name);
            const pPlus = document.createElement("button");
            pPlus.type = "button";
            pPlus.textContent = "+";
            pPlus.setAttribute("aria-label", "增加份数");

            pMinus.addEventListener("click", () => {
                setPortion(item.name, getPortion(item.name) - 1);
                pNum.textContent = getPortion(item.name);
                updatePreview();
                updateFilterCount();
                if (onlySelected && getPortion(item.name) <= 0) {
                    renderList();
                }
            });
            pPlus.addEventListener("click", () => {
                setPortion(item.name, getPortion(item.name) + 1);
                pNum.textContent = getPortion(item.name);
                updatePreview();
                updateFilterCount();
            });

            portionCtrl.appendChild(pMinus);
            portionCtrl.appendChild(pNum);
            portionCtrl.appendChild(pPlus);
            portionItem.appendChild(portionName);
            portionItem.appendChild(portionCtrl);

            ctrlGroup.appendChild(portionItem);

                        row.appendChild(imgWrap);
            row.appendChild(nameEl);
            row.appendChild(ctrlGroup);
            foodListEl.appendChild(row);
        });
    }
    updateFilterCount();
}

function updateFilterCount() {
    const count = selectedCount();
    const total = totalDishCount();
    if (count > 0) {
        filterCountEl.textContent = `已选 ${count} 道 / 共 ${total} 份`;
    } else {
        filterCountEl.textContent = "";
    }
}

// ========== 预览栏 ==========
function updatePreview() {
    const names = Object.keys(cart).filter(name => getPortion(name) > 0);
    if (names.length === 0) {
        previewText.textContent = "暂无";
        return;
    }
    previewText.innerHTML = "";
    names.forEach(name => {
        const item = foodList.find(f => f.name === name);
        const wrap = document.createElement("span");
        wrap.className = "preview-item";

        if (item && item.img) {
            const img = document.createElement("img");
            img.className = "preview-img";
            img.src = item.img;
            img.alt = name;
            img.onerror = function() {
                this.style.display = "none";
            };
            wrap.appendChild(img);
        }

        const nameEl = document.createElement("span");
        nameEl.className = "preview-name";
        nameEl.textContent = name;
        wrap.appendChild(nameEl);

        const numEl = document.createElement("span");
        numEl.className = "preview-num";
        numEl.textContent = `×${getPortion(name)}`;
        wrap.appendChild(numEl);

        previewText.appendChild(wrap);
    });
}

// ========== 分类切换 ==========
categoryWrap.addEventListener("click", (e) => {
    const item = e.target.closest(".category-item");
    if (!item) return;
    const cate = item.dataset.cate;
    if (cate === currentCate) return;
    currentCate = cate;

    // 更新高亮
    categoryWrap.querySelectorAll(".category-item").forEach(el => {
        el.classList.toggle("active", el.dataset.cate === cate);
    });

    renderList();
    rightArea.scrollTop = 0;
});

// ========== 搜索 ==========
searchInput.addEventListener("input", () => {
    searchKeyword = searchInput.value.trim();
    renderList();
    rightArea.scrollTop = 0;
});

// ========== 只看已选 ==========
onlySelectedEl.addEventListener("change", () => {
    onlySelected = onlySelectedEl.checked;
    renderList();
    rightArea.scrollTop = 0;
});

// ========== 提交订单 ==========
submitBtn.addEventListener("click", async () => {
    const names = Object.keys(cart).filter(name => getPortion(name) > 0);
    if (names.length === 0) {
        alert("请先选择菜品哦～");
        return;
    }
    const user = userNameInput.value.trim();
    if (!user) {
        alert("请先填写下单人名字～");
        userNameInput.focus();
        return;
    }

    const summary = names.map(name => `${name}×${getPortion(name)}`).join("、");
    const totalPortions = totalDishCount();

    submitBtn.disabled = true;
    submitBtn.textContent = "提交中...";

    try {
        const payload = {
            records: [
                {
                    fields: {
                        "下单人": user,
                        "菜品": summary,
                        "菜品明细": summary,
                        "菜品数量": names.length,
                        "总份数": totalPortions,
                        "下单时间": new Date().toISOString()
                    }
                }
            ]
        };

        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        alert("提交成功！🎉\n" + summary);
        cart = {};
        saveCart();
        updatePreview();
        updateFilterCount();
        renderList();
    } catch (err) {
        console.error("提交失败", err);
        alert("提交失败，请检查网络后重试。\n" + (err.message || ""));
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "提交订单";
    }
});

// ========== 初始化 ==========
function init() {
    loadCart();
    loadUser();
    renderList();
    updatePreview();
    updateFilterCount();
}

init();

// 注册 Service Worker
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.warn("SW register failed:", err));
    });
}
</script>
